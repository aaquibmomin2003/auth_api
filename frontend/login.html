<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <h2>Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <br><br>

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <br><br>

    <button onclick="login()">
        Login
    </button>

    <script>

        async function login() {

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            console.log("Email:", email);
            console.log("Password:", password);

            const formData = new URLSearchParams();

            formData.append(
                "username",
                email
            );

            formData.append(
                "password",
                password
            );

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                            "application/x-www-form-urlencoded"
                        },
                        body: formData
                    }
                );

                const data =
                    await response.json();

                console.log(
                    "Status:",
                    response.status
                );

                console.log(
                    "Response:",
                    data
                );

                if (!response.ok) {

                    alert(
                        "Login Failed: " +
                        data.detail
                    );

                    return;
                }

                localStorage.setItem(
                    "token",
                    data.access_token
                );

                alert("Login Success");

                window.location.href =
                    "notes.html";

            } catch (error) {

                console.error(error);

                alert(
                    "Cannot connect to FastAPI server"
                );
            }
        }

    </script>

</body>
</html>
